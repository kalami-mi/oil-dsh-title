# oil-dsh-title 的 bundle 补丁层。
#
# Harness 的会话标题服务同一时刻只允许一个标题提供者，内置的是「只看首条提示」的
# session-title-llm。这里先把它关掉，再挂上本插件的提供者：
#   - 首条提示：仍由标题服务自动触发，生成第一版「emoji 对象｜目标」标题；
#   - 之后每一轮结束：本插件自己调用 sessionTitle.refresh，由模型判断保留还是更新。
# 用户手动改名（界面或 /title set）会被标题服务记为 user 来源并固定，本插件不会覆盖。

- id: session-title-llm
  disabled: true

- insert:
    - id: oil-dsh-title
      name: oil-dsh-title
      config:
        # 命名用的路由。留空时沿用当前会话正在使用的 provider / model。
        # 两项必须同时填写，例如 provider: r4-coder，model: deepseek-v4.1-flash。
        provider: ''
        model: ''
        # 参考最近几轮有文字的对话。
        recentTurns: 5
        # 送给命名模型的摘录总字节上限；超出时保留标题而不是截断后硬判。
        maxInputBytes: 16384
        # 带思考的模型（如 deepseek-v4.1-flash）会先消耗思考 token，上限太小会在输出标题前被截断。
        maxOutputTokens: 4096
        timeoutMs: 60000
        # 稳定标题后，纯确认（好的、收到、继续……）最多连续跳过几轮不调用模型。
        maxConfirmationSkips: 2
